spring:
  application:
    name: deliveryapp

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/delivery_db
    username: delivery_user
    password: delivery_pass

  jpa:
    hibernate:
      ddl-auto: update # 개발 환경 설정
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
jwt:
  secret:
    key: c2hyZWstdmVyeS1zZWNyZXQta2V5LWFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA== # Base64 인코딩된 32바이트 이상의 키
  expiration:
    access-token: 3600000 # 60분 (ms 단위)
    refresh-token: 1209600000 # 14일 (ms 단위)